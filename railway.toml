[build]
builder = "dockerfile"

[[services]]
name = "bot"
dockerfile = "Dockerfile.bot"
startCommand = "/app/bot"

[services.volumes]
mount = "/data"
name = "tracker-state"

[[services]]
name = "worker"
dockerfile = "Dockerfile.worker"
startCommand = "/app/worker"

[services.volumes]
mount = "/data"
name = "tracker-state"

[services.deploy]
startCommand = "/app/worker"
