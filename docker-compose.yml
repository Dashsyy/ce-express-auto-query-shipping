version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      STATE_FILE: /data/state.json
      PORT: 8080
    volumes:
      - tracker-state:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      STATE_FILE: /data/state.json
    volumes:
      - tracker-state:/data
    restart: unless-stopped
    depends_on:
      - bot

volumes:
  tracker-state:
    driver: local
